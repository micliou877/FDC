<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工具 5：個股漲幅排行</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif; background: #0f1419; color: #e6e6e6; padding: 14px; min-height: 100vh; }
h1 { font-size: 18px; margin-bottom: 4px; color: #fff; }
.subtitle { font-size: 11px; color: #888; margin-bottom: 14px; }

.status-card { background: #1a2026; border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; border-left: 4px solid #4a9eff; font-size: 12px; color: #aaa; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.status-card .info { display: flex; flex-wrap: wrap; gap: 14px; }
.status-card .info span b { color: #e6e6e6; }

.btn { background: #1a2026; color: #e6e6e6; border: 1px solid #2a3138; padding: 7px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; }
.btn.primary { background: #4a9eff; color: #fff; border-color: #4a9eff; }
.btn:hover { opacity: 0.9; }

.error-card { background: #2a1a1a; border-left: 4px solid #d63031; border-radius: 8px; padding: 14px; margin-bottom: 14px; font-size: 12px; color: #ffb3b3; display: none; }
.error-card textarea { width: 100%; min-height: 100px; background: #0f1419; color: #e6e6e6; border: 1px solid #2a3138; border-radius: 4px; padding: 8px; font-family: 'SF Mono', Consolas, monospace; font-size: 11px; margin-top: 8px; }

.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11px; color: #aaa; margin-bottom: 10px; }
.legend .item { display: flex; align-items: center; gap: 4px; }

table.rank-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.rank-table th { background: #1a2026; padding: 9px 6px; text-align: left; font-weight: 600; color: #aaa; font-size: 10px; white-space: nowrap; position: sticky; top: 0; }
.rank-table td { padding: 8px 6px; border-bottom: 1px solid #1a2026; white-space: nowrap; }
.rank-table tbody tr:hover { background: #1a2026; }
.rank-table tbody tr:nth-child(-n+3) td.rank-cell { color: #ffc94a; font-weight: 700; }

.pos-text { color: #ff6b6b; font-weight: 600; }
.neg-text { color: #3a9e6a; font-weight: 600; }
.zero-text { color: #aaa; }

.market-badge { font-size: 9px; padding: 1px 5px; border-radius: 3px; background: #2a3138; color: #888; }

.badge { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 700; white-space: nowrap; }
.badge.up { background: rgba(255, 107, 107, 0.15); color: #ff6b6b; }
.badge.down { background: rgba(58, 158, 106, 0.15); color: #3a9e6a; }
.badge.same { background: rgba(150, 150, 150, 0.15); color: #999; }
.badge.new { background: rgba(255, 201, 74, 0.18); color: #ffc94a; }

.empty { text-align: center; padding: 40px; color: #666; font-size: 12px; }

@media (max-width: 600px) {
  body { padding: 10px; }
  .rank-table { font-size: 10px; }
  .rank-table th, .rank-table td { padding: 6px 3px; }
  .status-card { flex-direction: column; align-items: flex-start; }
}
</style>
</head>
<body>

<h1>📈 工具 5：個股漲幅排行</h1>
<div class="subtitle">今日漲幅前 20 名，並標示相對於上次記錄的名次變化</div>

<div class="status-card">
  <div class="info">
    <span>報價時間：<b id="quoteTime">—</b></span>
    <span>比較基準：<b id="baseDate">—</b></span>
    <span>樣本數：<b id="sampleCount">—</b></span>
  </div>
  <button class="btn primary" id="refreshBtn">🔄 重新整理</button>
</div>

<div class="error-card" id="errorCard">
  <div id="errorMsg"></div>
  <div style="margin-top:8px;">若自動抓取失敗（例如離線或 CORS 限制），可將 quotes.json 內容貼在下方後手動載入：</div>
  <textarea id="manualInput" placeholder='貼上 quotes.json 完整內容...'></textarea>
  <button class="btn" id="manualLoadBtn" style="margin-top:8px;">手動載入</button>
</div>

<div class="legend">
  <span class="item"><span class="badge up">▲2</span> 晉升排名</span>
  <span class="item"><span class="badge down">▼3</span> 排名下降</span>
  <span class="item"><span class="badge same">— </span> 排名持平</span>
  <span class="item"><span class="badge new">🆕 新進榜</span> 新進榜</span>
</div>

<table class="rank-table">
  <thead>
    <tr>
      <th>名次</th>

      <th>名稱</th>
      <th>市場</th>
      <th style="text-align:right">現價</th>
      <th style="text-align:right">漲跌幅</th>
      <th style="text-align:right">成交金額(億)</th>
    </tr>
  </thead>
  <tbody id="rankTbody">
    <tr><td colspan="8" class="empty">載入中…</td></tr>
  </tbody>
</table>

,"8081":"致新","8086":"宏捷科","8099":"大世科","8101":"華冠","8114":"振樺電","8121":"越峰","8131":"福懋科","8210":"勤誠","8222":"寶一","8234":"新漢","8255":"朋程","8261":"富鼎","8299":"群聯","8358":"金居","8374":"羅昇","8473":"山林水","8996":"高力","9802":"鈺邦","9904":"寶成","9910":"豐泰","9914":"美利達","9919":"康那香","9921":"巨大","9941":"裕融","9945":"潤泰新","0050":"大盤(0050)"};

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || "{}"); } catch (e) { return {}; }
}

function saveHistory(history) {
  const dates = Object.keys(history).sort();
  while (dates.length > 60) { delete history[dates.shift()]; }
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
}

function extractDate(updatedStr) {
  const m = /^(\d{4}-\d{2}-\d{2})/.exec(updatedStr || "");
  return m ? m[1] : "unknown";
}

function computeTop(quotes) {
  const list = Object.entries(quotes)
    .filter(([code, q]) => code !== "0050" && typeof q.pct1 === "number")
    .map(([code, q]) => ({ code, name: STOCK_NAMES[code] || code, market: q.market || "-", price: q.price, pct1: q.pct1, amount: q.amount }))
    .sort((a, b) => b.pct1 - a.pct1);
  return { top: list.slice(0, TOP_N), total: list.length };
}

function fmtPct(v) {
  if (typeof v !== "number") return "-";
  const cls = v > 0 ? "pos-text" : v < 0 ? "neg-text" : "zero-text";
  const sign = v > 0 ? "+" : "";
  return `<span class="${cls}">${sign}${v.toFixed(2)}%</span>`;
}

function fmtNum(v, digits) {
  if (typeof v !== "number") return "-";
  return v.toFixed(digits);
}

function rankBadge(code, currentRank, prevRanks) {
  if (!(code in prevRanks)) {
    return `<span class="badge new">🆕 新進榜</span>`;
  }
  const prevRank = prevRanks[code];
  const diff = prevRank - currentRank;
  if (diff > 0) return `<span class="badge up">▲${diff} 晉升</span>`;
  if (diff < 0) return `<span class="badge down">▼${-diff} 下降</span>`;
  return `<span class="badge same">— 持平</span>`;
}

function render(data) {
  const { updated, quotes } = data;
  const snapshotDate = extractDate(updated);
  const { top, total } = computeTop(quotes);

  document.getElementById("quoteTime").textContent = updated || "—";
  document.getElementById("sampleCount").textContent = `${total} 檔（有漲跌幅資料）`;

  const history = loadHistory();
  const priorDates = Object.keys(history).filter(d => d < snapshotDate).sort();
  const baseDate = priorDates.length ? priorDates[priorDates.length - 1] : null;
  const prevRanks = baseDate ? history[baseDate] : {};

  document.getElementById("baseDate").textContent = baseDate ? `${baseDate}（上次記錄）` : "尚無先前記錄";

  const tbody = document.getElementById("rankTbody");
  if (!top.length) {
    tbody.innerHTML = `<tr><td colspan="8" class="empty">quotes.json 中沒有可用的漲跌幅資料</td></tr>`;
  } else {
    tbody.innerHTML = top.map((s, i) => {
      const rank = i + 1;
      return `
        <tr>
          <td class="rank-cell">${rank}</td>
          <td>${rankBadge(s.code, rank, prevRanks)}</td>
          <td>${s.code}</td>
          <td>${s.name}</td>
          <td><span class="market-badge">${s.market}</span></td>
          <td style="text-align:right">${fmtNum(s.price, 2)}</td>
          <td style="text-align:right">${fmtPct(s.pct1)}</td>
          <td style="text-align:right">${fmtNum(s.amount, 2)}</td>
        </tr>
      `;
    }).join("");
  }

  const currentRanks = {};
  top.forEach((s, i) => { currentRanks[s.code] = i + 1; });
  history[snapshotDate] = currentRanks;
  saveHistory(history);
}

function showError(msg) {
  document.getElementById("errorCard").style.display = "block";
  document.getElementById("errorMsg").textContent = msg;
}

function hideError() {
  document.getElementById("errorCard").style.display = "none";
}

async function loadData() {
  hideError();
  document.getElementById("rankTbody").innerHTML = `<tr><td colspan="8" class="empty">載入中…</td></tr>`;
  try {
    const res = await fetch(`${QUOTES_URL}?t=${Date.now()}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    render(data);
  } catch (e) {
    showError(`自動抓取失敗：${e.message}`);
    document.getElementById("rankTbody").innerHTML = `<tr><td colspan="8" class="empty">載入失敗，請見上方說明</td></tr>`;
  }
}

document.getElementById("refreshBtn").onclick = loadData;
document.getElementById("manualLoadBtn").onclick = () => {
  const text = document.getElementById("manualInput").value.trim();
  if (!text) return alert("請先貼上 quotes.json 內容");
  try {
    const data = JSON.parse(text);
    hideError();
    render(data);
  } catch (e) {
    alert("JSON 格式錯誤：" + e.message);
  }
};

loadData();
</script>
</body>
</html>
