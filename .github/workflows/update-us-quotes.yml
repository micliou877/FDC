name: Update US stock quotes

on:
  schedule:
    # 每個美股交易日收盤後跑一次(UTC 22:00 = 台北隔天06:00，美股收盤約UTC 20:00-21:00後留緩衝)。
    # 只有一天一次，不像台股報價每15分鐘那種高頻排程，GitHub對低頻排程的準時性可靠得多。
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --upgrade yfinance

      - name: Fetch US quotes
        run: python scripts/fetch_us_quotes.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- us_stocks.json; then
            echo "no change"
            exit 0
          fi
          # 先把新抓到的us_stocks.json內容存到別處，因為衝突重試時會整個硬重置工作目錄。
          cp us_stocks.json /tmp/us_stocks_new.json
          for i in 1 2 3 4 5; do
            if ! git diff --quiet -- us_stocks.json; then
              git add us_stocks.json
              git commit -m "更新美股股池快照 $(date -u +'%Y-%m-%d %H:%M UTC')"
            fi
            if git push; then
              exit 0
            fi
            echo "push rejected, retrying (attempt $i)"
            git fetch origin main
            # 用 reset --hard 完全同步到最新的origin/main（連同index.html等其他檔案），
            # 不能用 reset --soft：那個只移動HEAD、不會更新工作目錄跟索引，如果這個checkout
            # 一開始就落後於其他同時在跑的工作，soft reset完再commit會把它自己checkout時
            # 那份舊版的其他檔案（例如index.html）一起夾帶進新commit，等於把後來的修改蓋掉。
            git reset --hard origin/main
            cp /tmp/us_stocks_new.json us_stocks.json
            sleep $((RANDOM % 5 + 1))
          done
