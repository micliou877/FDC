name: Update TW stock quotes

on:
  schedule:
    # 高頻率cron(*/15)在GitHub Actions上不可靠，實測過去兩週多每天只真的觸發1~2次，不是每15分鐘。
    # 改成在開盤前後多留幾個嘗試機會（半小時一次），只要其中一次真的被觸發，
    # 工作內部就會自己迴圈跑到收盤，不再依賴GitHub準時觸發每一次。
    - cron: "0,30 0-5 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 400
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch quotes（排程觸發：內部迴圈跑到收盤；手動觸發：只抓一次）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          commit_and_push() {
            if ! git diff --quiet -- quotes.json; then
              git add quotes.json
              git commit -m "更新台股報價快照 $(date -u +'%Y-%m-%d %H:%M UTC')"
              for i in 1 2 3 4 5; do
                if git push; then
                  return 0
                fi
                echo "push rejected, retrying (attempt $i)"
                git fetch origin main
                # quotes.json每次都整份重新產生，不需要真的merge，直接拿自己這份最新內容
                # 蓋在最新的origin/main上即可，避免rebase衝突讓整個工作直接失敗。
                git reset --soft origin/main
                git add quotes.json
                git commit -m "更新台股報價快照 $(date -u +'%Y-%m-%d %H:%M UTC')" --allow-empty
                sleep $((RANDOM % 5 + 1))
              done
            else
              echo "no change"
            fi
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/fetch_quotes.py
            commit_and_push
          else
            # 排程觸發：從現在跑到台北時間13:59（UTC 05:59），每15分鐘抓一次
            END_EPOCH=$(date -u -d "$(date -u +%Y-%m-%d) 05:59:00" +%s)
            while [ "$(date -u +%s)" -lt "$END_EPOCH" ]; do
              python scripts/fetch_quotes.py
              commit_and_push
              sleep 900
            done
          fi
