name: Update TW stock quotes

on:
  schedule:
    # 高頻率cron(*/15)在GitHub Actions上不可靠，實測過去兩週多每天只真的觸發1~2次，不是每15分鐘。
    # 改成在開盤前後多留幾個嘗試機會（半小時一次），只要其中一次真的被觸發，
    # 工作內部就會自己迴圈跑到收盤，不再依賴GitHub準時觸發每一次。
    - cron: "0,30 0-5 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 400
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch quotes（排程觸發：內部迴圈跑到收盤；手動觸發：只抓一次）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          commit_and_push() {
            if git diff --quiet -- quotes.json; then
              echo "no change"
              return 0
            fi
            # 先把新抓到的quotes.json內容存到別處，因為衝突重試時會整個硬重置工作目錄。
            cp quotes.json /tmp/quotes_new.json
            for i in 1 2 3 4 5; do
              if ! git diff --quiet -- quotes.json; then
                git add quotes.json
                git commit -m "更新台股報價快照 $(date -u +'%Y-%m-%d %H:%M UTC')"
              fi
              if git push; then
                return 0
              fi
              echo "push rejected, retrying (attempt $i)"
              git fetch origin main
              # 用 reset --hard 完全同步到最新的origin/main（連同index.html等其他檔案），
              # 不能用 reset --soft：那個只移動HEAD、不會更新工作目錄跟索引，如果這個checkout
              # 一開始就落後於其他同時在跑的工作，soft reset完再commit會把它自己checkout時
              # 那份舊版的其他檔案（例如index.html）一起夾帶進新commit，等於把後來的修改蓋掉。
              # 這裡改成hard reset徹底對齊最新內容，再把自己抓到的quotes.json疊上去，就不會動到別的檔案。
              git reset --hard origin/main
              cp /tmp/quotes_new.json quotes.json
              sleep $((RANDOM % 5 + 1))
            done
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/fetch_quotes.py
            commit_and_push
          else
            # 排程觸發：從現在跑到台北時間13:59（UTC 05:59），每15分鐘抓一次
            END_EPOCH=$(date -u -d "$(date -u +%Y-%m-%d) 05:59:00" +%s)
            while [ "$(date -u +%s)" -lt "$END_EPOCH" ]; do
              python scripts/fetch_quotes.py
              commit_and_push
              sleep 900
            done
          fi
