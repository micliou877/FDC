name: Scan market for off-pool movers

on:
  schedule:
    # 原本只排06:00(UTC)一個時段，實測GitHub的schedule觸發不保證準時——跟update-quotes.yml
    # 踩過的坑一樣，那天的06:00這個唯一時段完全沒觸發，整天就只剩手動按才有新資料。
    # 改成06:00~08:30每半小時留一個嘗試機會，script本身是idempotent(同一天重跑只是把
    # 當天那筆紀錄覆蓋成一樣的內容，不會重複算進歷史)，多排幾個時段成本很低。
    - cron: "0,30 6-8 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scan market
        run: python scripts/scan_market.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- market_scan.json market_history.json; then
            echo "no change"
            exit 0
          fi
          cp market_scan.json /tmp/market_scan_new.json
          cp market_history.json /tmp/market_history_new.json
          for i in 1 2 3 4 5; do
            if ! git diff --quiet -- market_scan.json market_history.json; then
              git add market_scan.json market_history.json
              git commit -m "全市場掃描：股池外異動股 $(date -u +'%Y-%m-%d')"
            fi
            if git push; then
              exit 0
            fi
            echo "push rejected, retrying (attempt $i)"
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/market_scan_new.json market_scan.json
            cp /tmp/market_history_new.json market_history.json
            sleep $((RANDOM % 5 + 1))
          done
